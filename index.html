<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JewelryBaby</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 第一页 开始 - Hero Section -->
  <section id="hero">
    <div class="hero-visual">
      <!-- 图片或视频占位 -->
      <img src="hero-image.jpg" alt="JewelryBaby" />
    </div>
    <div class="hero-content">
      <h1>JewelryBaby</h1>
      <p>Timeless Luxury, Crafted for You</p>
      <button id="exploreBtn">Explore the Collection</button>
    </div>
  </section>
  <!-- 第一页 结束 -->

  <!-- 第二页 开始 - 品牌与价值观 Brand Philosophy -->
<section id="brand">

  <div class="brand-container">

    <div class="brand-text">
      <h2>Our Philosophy</h2>

      <p class="brand-description">
        JewelryBaby believes that true jewelry is not decoration,
        but a reflection of identity, time, and personal legacy.
      </p>

      <ul class="brand-values">
        <li>Rare Materials</li>
        <li>Handcrafted Precision</li>
        <li>Timeless Design</li>
        <li>Private Ownership</li>
      </ul>
    </div>

    <div class="brand-visual">
      <!-- 品牌形象图 / 抽象图 / 工艺细节图 -->
      <img src="brand-image.jpg" alt="JewelryBaby Craftsmanship">
    </div>

  </div>

</section>
<!-- 第二页 结束 -->

  
  <script src="script.js"></script>
</body>
</html>
